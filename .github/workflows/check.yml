name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dist が最新か
        run: |
          ./build.sh
          git diff --exit-code -- dist/ || { echo "::error::dist/ が古い。./build.sh を実行してコミットする"; exit 1; }
      - name: shellcheck
        run: shellcheck build.sh dist/*.sh
      - name: 起動スクリプトの取得先に到達できるか
        run: |
          for f in dist/*.setup.sh; do
            url=$(grep -o 'https://raw.githubusercontent.com/[^"]*' "$f")
            curl -fsSI "$url" > /dev/null || { echo "::error::$f の取得先に到達できない: $url"; exit 1; }
          done

  smoke:
    # クラウド環境と同じ Ubuntu 24.04 で生成スクリプトを root 実行し、ツールが入るか確認する。
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ランナー既定の .NET を外す
        # クラウド環境には .NET が無いため、setup script が入れたものだけで動くか確かめる
        run: sudo rm -rf /usr/share/dotnet
      - uses: actions/setup-python@v5
        # クラウドでは PATH の python3 が 3.13 (システムの /usr/bin/python3.12 とは別)。同じ状態で setup を実行する
        with:
          python-version: "3.13"
      - name: run dist/godot.sh
        # モジュールは RAW_BASE から tools/ を取得するため、検証中のコミットを指す (main は CDN のキャッシュで古いことがある)
        run: |
          start=$(date +%s)
          sudo env PATH="$PATH" RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}" bash dist/godot.sh
          echo "::notice::setup: $(( $(date +%s) - start ))s, game-voice $(sudo du -sh /opt/game-voice | cut -f1)"
      - name: cloud-env-check
        # セッションで実行するのと同じ確認。setup で失敗したモジュールも NG になる
        run: sudo cloud-env-check
      - name: cloud-prepare
        run: |
          sudo cloud-prepare
          if sudo cloud-prepare unknown-name; then exit 1; fi
          sudo cloud-prepare godot-export-templates
          sudo ls /root/.local/share/godot/export_templates/4.7.2.stable.mono/ | grep -q linux_release.x86_64
      - name: game-voice
        run: |
          mkdir "$RUNNER_TEMP/voice"
          cd "$RUNNER_TEMP/voice"
          git init -q
          sudo game-voice presets | grep -q '^cheerful_guide:'
          /usr/bin/time -v sudo game-voice say "こんにちは。冒険を始めましょう。" --preset cheerful_guide -o out/guide.wav 2> time.log
          echo "::notice::say (モデル読み込み込み): $(grep -E 'Elapsed|Maximum resident' time.log | tr -s ' ' | paste -sd ';')"
          if sudo game-voice say "もう一度" -o out/guide.wav; then exit 1; fi
          sudo game-voice save-preset '{"id": "my_guide", "name": "案内役", "caption": "明るい女性の声。", "voice": "out/guide.wav", "seed": 7}'
          grep -q '"voice": "out/guide.wav"' voice-presets.json
          cat > batch.json <<'EOF'
          {"preset": "my_guide", "items": [
            {"text": "クエストを受け付けました。", "output": "out/quest.wav", "caption": "楽しそうに。"},
            {"text": "ここは通行止めだ。", "output": "out/guard.wav", "preset": "stern_guardian"}
          ]}
          EOF
          sudo game-voice batch batch.json
          python3 - <<'EOF'
          import json, struct, wave
          for name in ("guide", "quest", "guard"):
              with wave.open(f"out/{name}.wav") as w:
                  assert (w.getframerate(), w.getsampwidth(), w.getnchannels()) == (48000, 2, 1), name
                  frames = w.readframes(w.getnframes())
              samples = struct.unpack(f"<{len(frames) // 2}h", frames)
              assert w.getnframes() > 48000 * 0.5 and max(map(abs, samples)) > 1000, name
              meta = json.load(open(f"out/{name}.json", encoding="utf-8"))
              print(name, meta["preset"], meta["voice"], meta["seed"], meta["duration_seconds"], meta["generation_seconds"])
          assert json.load(open("out/quest.json"))["voice"].endswith("out/guide.wav")
          EOF
      - name: verify GDScript + C#
        working-directory: tests/godot-mixed
        env:
          DOTNET_ROOT: ""
        run: |
          dotnet build
          timeout 120 godot --headless --path . 2>&1 | tee run.log
          grep -q "MIXED_OK: Hello GDScript from C#" run.log

  smoke-default:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: run dist/default.sh
        run: sudo bash dist/default.sh
      - name: cloud-env-check
        run: sudo cloud-env-check

  smoke-react-native:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # クラウド環境の既定と同じ版
          node-version: 22
      - name: ランナー既定の Android SDK を外す
        # クラウド環境には Android SDK が無いため、setup script が入れたものだけで動くか確かめる
        run: sudo rm -rf /usr/local/lib/android
      - name: run dist/react-native.sh
        run: sudo bash dist/react-native.sh
      - name: cloud-env-check (Environment variables 未設定)
        # 設定漏れを NG として検出できるか確かめる。ランナー既定の ANDROID_HOME・JAVA_HOME は外す
        run: |
          out=$(sudo env -u ANDROID_HOME -u JAVA_HOME cloud-env-check) && exit 1
          echo "$out"
          grep -q '^NG  ANDROID_HOME' <<< "$out"
          grep -q '^NG  JAVA_HOME' <<< "$out"
      - name: cloud-env-check (README の Environment variables を設定)
        run: sudo env ANDROID_HOME=/opt/android-sdk JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 cloud-env-check
      - name: verify Expo Android build
        run: |
          # クラウドは root で動くため SDK に書き込める。CI は一般ユーザーなので所有者を移して Gradle の自動取得を通す
          sudo chown -R "$USER" /opt/android-sdk
          . /etc/profile.d/android.sh
          unset ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          ls -d /opt/android-sdk/*/* | sort > "$RUNNER_TEMP/sdk-before.txt"
          cd "$RUNNER_TEMP"
          npx --yes create-expo-app@latest app --template blank --yes
          cd app
          npx expo prebuild --platform android
          (cd android && ./gradlew assembleDebug --no-daemon -q)
          ls android/app/build/outputs/apk/debug/app-debug.apk
          # ビルド中に Gradle が自動取得したものがあれば、ANDROID_SDK_PACKAGES が古い (クラウドで毎回取得になる)
          ls -d /opt/android-sdk/*/* | sort > "$RUNNER_TEMP/sdk-after.txt"
          added=$(comm -13 "$RUNNER_TEMP/sdk-before.txt" "$RUNNER_TEMP/sdk-after.txt")
          if [ -n "$added" ]; then echo "::warning::ビルド中に SDK パッケージを追加取得した。ANDROID_SDK_PACKAGES を更新する: $added"; fi
