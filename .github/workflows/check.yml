name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dist が最新か
        run: |
          ./build.sh
          git diff --exit-code -- dist/ || { echo "::error::dist/ が古い。./build.sh を実行してコミットする"; exit 1; }
      - name: shellcheck
        run: shellcheck build.sh dist/*.sh

  smoke:
    # クラウド環境と同じ Ubuntu 24.04 で生成スクリプトを root 実行し、ツールが入るか確認する。
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: run dist/godot.sh
        run: sudo bash dist/godot.sh
      - name: verify
        run: |
          godot --headless --version
          fd --version
          bat --version
          shellcheck --version
